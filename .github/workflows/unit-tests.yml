name: Unit tests

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | head -n 1)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          xcodebuild \
            -project Tribuneros.xcodeproj \
            -scheme Tribuneros \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:TribunerosTests/RequesterCxTests \
            -skip-testing:TribunerosTests/RequesterHomeParsingTests/testGetLatestResultsParsesRealWebsite \
            test

  functions:
    name: Cloud Functions tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
      - run: npm --prefix functions test

  localization:
    name: Localization check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/l10n/check_localization.py
