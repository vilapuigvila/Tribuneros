# "Where to watch" with the flag off: Race info has no card at all (the coursedujour.com link is gone).
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
      ctCoursedujourNative: "off"
- extendedWaitUntil:
    visible:
      id: "home.today.hero"
    timeout: 20000
# The hero (CRO Race) is LIVE and opens the live race screen; race info is reached from a
# non-live race in "See all".
- tapOn:
    id: "home.today.seeAll"
- tapOn:
    id: "todayRaces.row.3"
    text: ".*GP de Montréal.*"
# Wait for the race info screen itself before checking the card is absent.
- extendedWaitUntil:
    visible: "Race info"
    timeout: 10000
- assertNotVisible:
    id: "raceInfo.whereToWatch"
- assertNotVisible: ".*Where to watch.*"
