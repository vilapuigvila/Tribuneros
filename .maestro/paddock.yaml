# Paddock tab (press circles, birthdays, Moves timeline) and a rider screen opened from a Moves card, on Debug mock data
# (mock scenario live): no network.
appId: com.pskmoons.Tribuneros
tags:
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- tapOn: "Paddock"
- extendedWaitUntil:
    visible: "Birthdays today"
    timeout: 45000
- extendedWaitUntil:
    notVisible: "Loading the paddock"
    timeout: 45000
# Transfer and program cards open the rider screen (birthdays open the web page); the mock feed
# has both, one per side of the Moves segmented control.
- scrollUntilVisible:
    element: "Moves"
- scrollUntilVisible:
    element: "TRANSFER,.*"
- tapOn: "TRANSFER,.*"
- assertVisible: "Transfer"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
- swipe:
    start: 1%, 50%
    end: 70%, 50%
- tapOn: "Programs.*"
- scrollUntilVisible:
    element: "PROGRAM,.*"
- tapOn: "PROGRAM,.*"
- assertVisible: "Program update"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
