# Paddock tab (press circles, birthdays, Moves timeline) and a rider screen opened from a Moves card, on Debug mock data
# (mock scenario live): no network.
appId: com.pskmoons.Tribuneros
tags:
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- tapOn: "Paddock"
- extendedWaitUntil:
    visible: "Birthdays today"
    timeout: 45000
- extendedWaitUntil:
    notVisible: "Loading the paddock"
    timeout: 45000
# Birthday rows, transfer cards and program cards all open the native rider screen; the mock feed
# has all three (transfers and programs sit on either side of the Moves segmented control).
- tapOn:
    id: "paddock.birthday.0"
- assertVisible: "Birthday"
- assertVisible: "AGE TODAY"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
- swipe:
    start: 1%, 50%
    end: 70%, 50%
- assertVisible: "Birthdays today"
- scrollUntilVisible:
    element: "Moves"
- scrollUntilVisible:
    element: "TRANSFER,.*"
- assertVisible: ".*Visma Lease a Bike → Ineos Grenadiers.*"
- tapOn: "TRANSFER,.*"
- assertVisible: "Transfer"
- assertVisible: "LEAVES"
- assertVisible: "Visma Lease a Bike"
- assertVisible: "JOINS"
- assertVisible: "Ineos Grenadiers"
- assertVisible: "Season"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
- swipe:
    start: 1%, 50%
    end: 70%, 50%
- scrollUntilVisible:
    element:
      id: "paddock.moves.more"
- tapOn:
    id: "paddock.moves.more"
- assertVisible: "MOCK Transfer Five"
- tapOn: "MOCK Transfer Two"
- assertVisible: "LEAVES"
- assertVisible: "Groupama - FDJ"
- assertVisible: "JOINS"
- assertVisible: "Lidl - Trek"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
- swipe:
    start: 1%, 50%
    end: 70%, 50%
- assertVisible: "See all 5 transfers"
- tapOn: "Programs.*"
- scrollUntilVisible:
    element: "PROGRAM,.*"
- tapOn: "PROGRAM,.*"
- assertVisible: "Program update"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
