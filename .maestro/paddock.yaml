# Paddock tab (feed + press strip) and a rider screen opened from a feed card, on Debug mock data
# (mock scenario live): no network.
appId: com.pskmoons.Tribuneros
tags:
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- tapOn: "Paddock"
- extendedWaitUntil:
    visible: "The press"
    timeout: 45000
- assertVisible: "Transfers"
- assertVisible: "Birthdays"
- extendedWaitUntil:
    notVisible: "Loading the paddock"
    timeout: 45000
# Transfer and program cards open the rider screen (birthdays open the web page); the mock feed
# has both. The chip brings the card to the top, clear of the tab bar.
- tapOn: "Transfers"
- tapOn: "TRANSFER,.*"
- assertVisible: "Transfer"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
- swipe:
    start: 1%, 50%
    end: 70%, 50%
- tapOn: "Programs"
- tapOn: "PROGRAM,.*"
- assertVisible: "Program update"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
