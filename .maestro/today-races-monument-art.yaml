# Results yesterday never shows the classic spoiler art: every hidden row is covered by a Monuments
# triple-champion painting (Roubaix, Sanremo or Flanders), a different one per row. Hide results ON
# hides them all; OFF shows the winner photos, and a long press hides one row behind its painting.
# Results today keeps the classic art (mock scenario "live", Debug build only).
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.results.spoilerArt.0"
    timeout: 20000
- tapOn:
    id: home.spoilerHint
    optional: true
- scrollUntilVisible:
    element:
      id: "home.yesterday.row.2"
    centerElement: true
- assertVisible:
    id: "home.yesterday.spoilerArt.monument.0"
- assertVisible:
    id: "home.yesterday.spoilerArt.monument.1"
- assertVisible:
    id: "home.yesterday.spoilerArt.monument.2"
- assertNotVisible:
    id: "home.yesterday.spoilerArt.0"
- longPressOn:
    id: "home.yesterday.spoilerArt.monument.0"
    retryTapIfNoChange: false
    delay: 1
- assertNotVisible:
    id: "home.yesterday.spoilerArt.monument.0"
- assertVisible:
    id: "home.yesterday.spoilerArt.monument.1"
- tapOn:
    id: "tab.settings"
- tapOn:
    id: "settings.hideResults"
- assertVisible:
    id: "settings.hideResults"
    text: "OFF"
- tapOn:
    id: "tab.home"
- scrollUntilVisible:
    element:
      id: "home.yesterday.row.0"
    centerElement: true
- assertNotVisible:
    id: "home.yesterday.spoilerArt.monument.0"
- assertNotVisible:
    id: "home.yesterday.spoilerArt.monument.1"
- longPressOn:
    id: "home.yesterday.row.0"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "home.yesterday.spoilerArt.monument.0"
- assertNotVisible:
    id: "home.yesterday.spoilerArt.monument.1"
- scrollUntilVisible:
    element:
      id: "home.results.card.0"
    direction: UP
    centerElement: true
- assertNotVisible:
    id: "home.results.spoilerArt.0"
- longPressOn:
    id: "home.results.card.0"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "home.results.spoilerArt.0"
