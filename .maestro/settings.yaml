# Settings tab (Debug build, mocked launch): the tiles, the on-demand onboarding replay (shows even
# though mocked launches skip it), the Hide results tile and its preview, and the Language sheet with "System default" selected.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
  - settings
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.results.card.0"
    timeout: 20000
- assertNotVisible:
    id: "onboarding"
- tapOn:
    id: "tab.settings"
- assertVisible:
    id: "settings.onboarding"
- assertVisible:
    id: "settings.language"
- tapOn:
    id: "settings.onboarding"
- extendedWaitUntil:
    visible:
      id: "onboarding"
    timeout: 5000
- assertVisible: "Welcome back to Cycling Tribune"
- tapOn:
    id: "onboarding.next"
- extendedWaitUntil:
    visible:
      id: "onboarding.page.1"
    timeout: 5000
- tapOn:
    id: "onboarding.next"
- extendedWaitUntil:
    visible:
      id: "onboarding.page.2"
    timeout: 5000
- tapOn:
    id: "onboarding.next"
- extendedWaitUntil:
    visible:
      id: "onboarding.page.3"
    timeout: 5000
- tapOn:
    id: "onboarding.done"
- extendedWaitUntil:
    notVisible:
      id: "onboarding"
    timeout: 5000
- assertVisible:
    id: "settings.onboarding"
- tapOn:
    id: "settings.language"
- extendedWaitUntil:
    visible:
      id: "settings.language.system"
    timeout: 5000
- assertVisible: "More languages are coming."
- assertVisible:
    id: "settings.language.system"
    selected: true
- assertVisible:
    id: "settings.language.en"
- assertVisible:
    id: "settings.language.ca"
# Picking a language closes the sheet.
- tapOn:
    id: "settings.language.system"
- assertVisible:
    id: "settings.onboarding"
# The Hide results tile flips in place (switch and preview animate together), its preview showing the current mode.
- assertVisible:
    id: "settings.hideResults"
    text: "ON"
- assertVisible:
    id: "settings.hideResults.preview"
- assertVisible: "Results stay hidden until you press and hold them."
- tapOn:
    id: "settings.hideResults"
- assertVisible:
    id: "settings.hideResults"
    text: "OFF"
- assertVisible:
    id: "settings.hideResults.preview"
- assertVisible: "Results are shown as soon as you open the app."
# Flipping back to ON replays the preview's loops.
- tapOn:
    id: "settings.hideResults"
- assertVisible:
    id: "settings.hideResults"
    text: "ON"
- assertVisible:
    id: "settings.hideResults.preview"
- assertVisible: "Results stay hidden until you press and hold them."
