# No Previews section without previews (mock scenario "empty": full-size resting card).
# Debug build only.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: empty
- extendedWaitUntil:
    visible:
      id: "home.today.empty"
    timeout: 20000
- assertNotVisible: "Previews"
- assertNotVisible:
    id: "home.previews.row.0"
