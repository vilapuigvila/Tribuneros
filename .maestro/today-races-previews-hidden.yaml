# No Previews section without previews (mock scenario "empty": full-size resting card) or when
# Today has races, even with previews listed (mock scenario "live": full-size hero). Debug build only.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: empty
- extendedWaitUntil:
    visible:
      id: "home.today.empty"
    timeout: 20000
- assertNotVisible: "Previews"
- assertNotVisible:
    id: "home.previews.row.0"

- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.today.hero"
    timeout: 20000
- assertNotVisible:
    id: "home.previews.row.0"
- assertNotVisible: "Previews"
