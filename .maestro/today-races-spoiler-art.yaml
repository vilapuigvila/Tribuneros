# The spoiler art in the photo slot of every Results today card and Yesterday row while hidden;
# a double tap removes it from that one race only, and a second double tap brings it back (mock
# scenario "live", Debug build only).
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.results.spoilerArt.0"
    timeout: 20000
- tapOn:
    id: home.spoilerHint
    optional: true
- assertVisible:
    id: "home.results.spoilerArt.1"
- doubleTapOn:
    id: "home.results.spoilerArt.0"
    retryTapIfNoChange: false
    delay: 1
- assertNotVisible:
    id: "home.results.spoilerArt.0"
- assertVisible:
    id: "home.results.spoilerArt.1"
- doubleTapOn:
    id: "home.results.card.0"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "home.results.spoilerArt.0"
- scrollUntilVisible:
    element:
      id: "home.yesterday.spoilerArt.0"
- assertVisible:
    id: "home.yesterday.spoilerArt.1"
- doubleTapOn:
    id: "home.yesterday.spoilerArt.0"
    retryTapIfNoChange: false
    delay: 1
- assertNotVisible:
    id: "home.yesterday.spoilerArt.0"
- assertVisible:
    id: "home.yesterday.spoilerArt.1"
- doubleTapOn:
    id: "home.yesterday.row.0"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "home.yesterday.spoilerArt.0"
