# CX Zone tab (Series lens) and every screen behind it: race results, calendar race, winner and rider, on Debug
# mock data (mock scenario live): no network. Sections and titles are drawn redacted while
# loading, so they only match once the data is in.
appId: com.pskmoons.Tribuneros
tags:
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- tapOn: "CX Zone"
- extendedWaitUntil:
    visible: "NEXT ROUND"
    timeout: 45000
- assertVisible: "Leaders"
- assertVisible: "SEASON PROGRESS"

# Series chips switch the whole page (Superprestige has a podium on its last round)
- tapOn: "Superprestige"
- assertVisible: "Last round"

# Last round -> Results -> full list -> race results (category tabs + results rows)
- scrollUntilVisible:
    element: "Results"
- tapOn: "Results"
- assertVisible: "Latest Cyclocross Results"
- tapOn:
    text: ".*\\(C.*\\).*"
    below: "Latest Cyclocross Results"
- extendedWaitUntil:
    visible: "MEN ELITE"
    timeout: 45000
- assertVisible: "Rider"
- swipe:
    start: 1%, 50%
    end: 70%, 50%

# Podium row -> rider (Profile facts + Recent results)
- tapOn:
    text: "\\d, [A-Z].*"
    below: "MEN ELITE"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
- swipe:
    start: 1%, 50%
    end: 70%, 50%
- swipe:
    start: 1%, 50%
    end: 70%, 50%

# Next races -> All races -> calendar race with a finished result, then a race with a history
# (both are in the mock calendar).
- scrollUntilVisible:
    element: "Calendar"
- tapOn: "Calendar"
- assertVisible: "All races"
- tapOn: "Race, country, winner..."
- inputText: "Kleeberg"
- tapOn: "Kleeberg Cross Mechelen.*"
- extendedWaitUntil:
    visible: "Results"
    timeout: 45000
- assertVisible: "Winner"

# Winner -> winner screen (Profile facts + Recent results)
- tapOn: ".*, Men Elite · .*"
- assertVisible: "Victory"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
- swipe:
    start: 1%, 50%
    end: 70%, 50%
- swipe:
    start: 1%, 50%
    end: 70%, 50%

# A race with a history: Past winners, and a past winner's rider screen
- tapOn: "Clear text"
- inputText: "koksijde"
- tapOn: "\\d\\d-\\d\\d-\\d{4}, .*Koksijde"
- extendedWaitUntil:
    visible: "Past winners"
    timeout: 45000
- tapOn: "\\d{4}, [A-Z].*"
- assertVisible: "Victory"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
