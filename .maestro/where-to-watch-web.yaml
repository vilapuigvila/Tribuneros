# "Where to watch" with the flag off keeps opening the coursedujour.com web page.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
      ctCoursedujourNative: "off"
- extendedWaitUntil:
    visible:
      id: "home.today.hero"
    timeout: 20000
# The hero (CRO Race) is LIVE and opens the live race screen; race info is reached from a
# non-live race in "See all".
- tapOn:
    id: "home.today.seeAll"
- tapOn:
    id: "todayRaces.row.3"
    text: ".*GP de Montréal.*"
- extendedWaitUntil:
    visible:
      id: "raceInfo.whereToWatch"
    timeout: 10000
- assertVisible: "CRO Race — Stage 1"
- tapOn:
    id: "raceInfo.whereToWatch"
- extendedWaitUntil:
    visible: ".*coursedujour.*"
    timeout: 15000
- assertNotVisible:
    id: "whereToWatch.day.0"
