# Language switch from the Language sheet (Debug build, mocked launch, English simulator): picking Català rebuilds the
# tabs in Catalan without a restart (back on the Settings root), Euskara does the same in Basque,
# and English switches back.
appId: com.pskmoons.Tribuneros
tags:
  - mock
  - settings
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.results.card.0"
    timeout: 20000
- tapOn:
    id: "tab.settings"
- tapOn:
    id: "settings.language"
- tapOn:
    id: "settings.language.ca"
- extendedWaitUntil:
    visible: "Configuració"
    timeout: 5000
- assertVisible: "Carretera"
- assertVisible: "Zona CX"
- assertVisible: "Presentació"
- tapOn:
    id: "settings.language"
- assertVisible: "Aviat hi haurà més idiomes."
- assertVisible:
    id: "settings.language.ca"
    selected: true
- tapOn:
    id: "settings.language.eu"
- extendedWaitUntil:
    visible: "Ezarpenak"
    timeout: 5000
- assertVisible: "Errepidea"
- assertVisible: "CX gunea"
- assertVisible: "Aurkezpena"
- tapOn:
    id: "settings.language"
- assertVisible:
    id: "settings.language.eu"
    selected: true
- tapOn:
    id: "settings.language.en"
- extendedWaitUntil:
    visible: "Road"
    timeout: 5000
- assertVisible: "Onboarding"
# The choice survives a relaunch.
- launchApp:
    stopApp: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible: "Road"
    timeout: 20000
