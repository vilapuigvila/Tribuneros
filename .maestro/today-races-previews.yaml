# No races today but PCS has previews (mock scenario "previews", Debug build only): the resting
# card shrinks to half height, a Previews section sits between Today and Results today, and a row
# opens the preview detail screen. The preview page is mocked (MOCK-prefixed route), no PCS request.
# With races today as well (mock scenario "live"), the first race keeps the Today hero and the
# Previews section follows it.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: previews
- extendedWaitUntil:
    visible:
      id: "home.previews.row.0"
    timeout: 20000
- assertVisible:
    id: "home.today.empty"
    text: ".*The peloton is resting.*"
- assertNotVisible:
    id: "home.today.hero"
- assertVisible: "Previews"
- assertVisible:
    id: "home.previews.row.0"
    text: ".*MOCK Tour de Langkawi.*"
- assertVisible:
    id: "home.previews.row.1"
- assertVisible: "Results today"

- tapOn:
    id: "home.previews.row.0"
- extendedWaitUntil:
    visible:
      id: "previewDetail.title"
    timeout: 10000
- assertVisible: ".*MOCK Kuala Kubu Bharu.*"
- assertVisible: ".*MOCK Ipoh.*"
- assertVisible: ".*09:12.*"
- assertVisible:
    id: "previewDetail.keypoint.0"
- assertVisible:
    id: "previewDetail.fact.0"
- swipe:
    start: 1%, 50%
    end: 70%, 50%
- assertVisible:
    id: "home.previews.row.0"

- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.today.hero"
    timeout: 20000
- assertNotVisible:
    id: "home.today.empty"
- scrollUntilVisible:
    element:
      id: "home.previews.row.0"
    direction: DOWN
- assertVisible: "Previews"
- assertVisible:
    id: "home.previews.row.0"
    text: ".*MOCK Tour de Langkawi.*"
