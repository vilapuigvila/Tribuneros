# No races today but PCS has previews (mock scenario "previews", Debug build only): the resting
# card shrinks to half height and the first preview floats over the bottom of the page, Road colors.
# A tap opens the preview detail; "+2" opens the list of every preview, whose rows open the detail too.
# The preview page is mocked (MOCK-prefixed route), no PCS request.
# With races today as well (mock scenario "live"), the Today hero stays and the card still floats.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: previews
- extendedWaitUntil:
    visible:
      id: "home.previews.card"
    timeout: 20000
- assertVisible:
    id: "home.today.empty"
    text: ".*The peloton is resting.*"
- assertNotVisible:
    id: "home.today.hero"
- assertVisible: "PREVIEW"
- assertVisible:
    id: "home.previews.card"
    text: ".*MOCK Tour de Langkawi.*"
# Only one preview card: the others sit behind the button
- assertNotVisible: "MOCK Gran Piemonte"
- assertNotVisible:
    id: "home.previews.row.0"
- assertVisible:
    id: "home.previews.more"
- assertVisible: "\\+2"
- assertVisible: "Results today"
- takeScreenshot: today-races-previews-floating

- tapOn:
    id: "home.previews.card"
- extendedWaitUntil:
    visible:
      id: "previewDetail.title"
    timeout: 10000
- assertVisible: ".*MOCK Kuala Kubu Bharu.*"
- assertVisible: ".*MOCK Ipoh.*"
- assertVisible: ".*09:12.*"
- assertVisible:
    id: "previewDetail.keypoint.0"
- assertVisible:
    id: "previewDetail.fact.0"
- swipe:
    start: 1%, 50%
    end: 70%, 50%
- assertVisible:
    id: "home.previews.card"

# The button: every preview in a list
- tapOn:
    id: "home.previews.more"
- extendedWaitUntil:
    visible:
      id: "previews.title"
    timeout: 10000
- assertVisible:
    id: "previews.row.0"
    text: ".*MOCK Tour de Langkawi.*"
- assertVisible:
    id: "previews.row.1"
    text: ".*MOCK Gran Piemonte.*"
- assertVisible:
    id: "previews.row.2"
    text: ".*MOCK Paris-Bourges.*"
- takeScreenshot: today-races-previews-list
- tapOn:
    id: "previews.row.0"
- extendedWaitUntil:
    visible:
      id: "previewDetail.title"
    timeout: 10000
- assertVisible: ".*MOCK Kuala Kubu Bharu.*"

- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.today.hero"
    timeout: 20000
- assertNotVisible:
    id: "home.today.empty"
- assertVisible:
    id: "home.previews.card"
    text: ".*MOCK Tour de Langkawi.*"
- assertVisible:
    id: "home.previews.more"
