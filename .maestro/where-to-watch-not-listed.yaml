# "Where to watch" for a race the schedule doesn't list: the card on Race info says so, and tapping
# it stays on Race info. Mock data: in mockScenario "later" the hero is Chrono des Nations, which the
# mock schedule leaves out.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: later
      ctCoursedujourNative: "on"
- extendedWaitUntil:
    visible:
      id: "home.today.hero"
    timeout: 20000
- assertVisible:
    id: "home.today.hero"
    text: ".*Chrono des Nations.*"
- tapOn:
    id: "home.today.hero"

- extendedWaitUntil:
    visible:
      id: "raceInfo.whereToWatch"
      text: ".*Where to watch.*Not in the TV listings.*"
    timeout: 10000

# Tapping the card does nothing: still on Race info, no schedule screen
- tapOn:
    id: "raceInfo.whereToWatch"
- assertVisible:
    id: "raceInfo.whereToWatch"
- assertNotVisible:
    id: "whereToWatch.day.0"
