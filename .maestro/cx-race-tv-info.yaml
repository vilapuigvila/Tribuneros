# CX calendar race detail: the "TV Info & Livestream" panel and a broadcaster tap, on Debug mock
# data (mock scenario live): no network. A channel tap hands the link to the system (Safari or the
# broadcaster's app) instead of an in-app sheet, so the flow comes back to the app and checks the
# race detail is still showing with no cyclocross24 page over it.
appId: com.pskmoons.Tribuneros
tags:
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- tapOn: "CX Zone"
- extendedWaitUntil:
    visible: "NEXT ROUND"
    timeout: 45000
- scrollUntilVisible:
    element: "Calendar"
- tapOn: "Calendar"
- assertVisible: "All races"
- tapOn: "ALL,? ?\\d+"
- tapOn: "Race, country, winner..."
- inputText: "koksijde"
- tapOn: "\\d\\d-\\d\\d-\\d{4}, .*Koksijde"
- extendedWaitUntil:
    visible: "TV Info & Livestream"
    timeout: 45000
- assertVisible: "Sporza"
- assertVisible: "Eurosport\\*"
- assertVisible:
    id: "tv-channel-Sporza"
- tapOn:
    id: "tv-channel-Sporza"
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "TV Info & Livestream"
    timeout: 20000
- assertNotVisible: ".*cyclocross24.*"
- assertNotVisible: "Done"
