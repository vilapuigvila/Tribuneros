# "Where to watch" on Race info with Remote Config flag ct_coursedujour_native on (Debug build only: the
# ctCoursedujourNative launch argument forces the flag; mockScenario serves the fixed mock schedule).
# The card is read-only: it shows the race's channels, and tapping it stays on Race info.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
      ctCoursedujourNative: "on"
- extendedWaitUntil:
    visible:
      id: "home.today.hero"
    timeout: 20000
# The hero (CRO Race) is LIVE and opens the live race screen; race info is reached from a
# non-live race in "See all".
- tapOn:
    id: "home.today.seeAll"
- tapOn:
    id: "todayRaces.row.3"
    text: ".*GP de Montréal.*"
- extendedWaitUntil:
    visible:
      id: "raceInfo.whereToWatch"
      text: ".*Where to watch.*FloBikes.*"
    timeout: 10000
- assertVisible: "CRO Race — Stage 1"

# Tapping the card does nothing: still on Race info, no schedule screen
- tapOn:
    id: "raceInfo.whereToWatch"
- assertVisible:
    id: "raceInfo.whereToWatch"
- assertNotVisible:
    id: "whereToWatch.day.0"
