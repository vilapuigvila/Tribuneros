# Today section on a day without races (mock scenario "empty", Debug build only): the resting
# scene replaces the hero, there is no "See all", and the results sections show their empty-state
# cards once loaded (no grey placeholders, no double tap).
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: empty
- extendedWaitUntil:
    visible:
      id: "home.today.empty"
    timeout: 20000
- assertVisible:
    id: "home.today.empty"
    text: ".*The peloton is resting.*"
- assertNotVisible:
    id: "home.today.hero"
- assertNotVisible:
    id: "home.today.seeAll"
- assertVisible: "Results today"
- assertVisible:
    id: "home.results.empty"
    text: "No results yet.*"
- assertNotVisible:
    id: "home.results.placeholder.0"
- assertNotVisible:
    id: "home.results.spoiler"
- assertNotVisible: "Race name placeholder"
- scrollUntilVisible:
    element:
      id: "home.yesterday.empty"
- assertVisible: "Results yesterday"
- assertVisible:
    id: "home.yesterday.empty"
    text: "No results yesterday.*"
- assertNotVisible:
    id: "home.yesterday.placeholder.row.0"
- assertNotVisible:
    id: "home.yesterday.seeAll"
- assertNotVisible:
    id: "home.yesterday.spoiler"
