# Today section on a day without races (mock scenario "empty", Debug build only): the resting
# scene replaces the hero, there is no "See all", and the other sections are still there.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: empty
- extendedWaitUntil:
    visible:
      id: "home.today.empty"
    timeout: 20000
- assertVisible:
    id: "home.today.empty"
    text: ".*The peloton is resting.*"
- assertNotVisible:
    id: "home.today.hero"
- assertNotVisible:
    id: "home.today.seeAll"
- assertVisible: "Results today"
