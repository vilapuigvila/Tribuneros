# Results today and Yesterday behind their spoiler chips, the Yesterday list, and the History
# banner (mock scenario "live", Debug build only). Spoilers start off, so the results are folded
# away until the chip is tapped; the setting is shared with the Yesterday list.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.results.spoiler"
    timeout: 20000

# Results today: folded away by default, cards after the chip is tapped, folded again on a second tap
- assertVisible:
    id: "home.results.spoiler"
    text: "Spoiler is off"
- assertNotVisible:
    id: "home.results.card.0"
- tapOn:
    id: "home.results.spoiler"
- assertVisible:
    id: "home.results.spoiler"
    text: "Spoiler is on"
- assertVisible:
    id: "home.results.card.0"
    text: "Giro della Toscana.*"
- tapOn:
    id: "home.results.spoiler"
- assertVisible:
    id: "home.results.spoiler"
    text: "Spoiler is off"
- assertNotVisible:
    id: "home.results.card.0"

# Yesterday: folded away by default, a preview of three rows after the chip is tapped
- scrollUntilVisible:
    element:
      id: "home.yesterday.spoiler"
- assertVisible:
    id: "home.yesterday.spoiler"
    text: "Spoiler is off"
- assertNotVisible:
    id: "home.yesterday.row.0"
- tapOn:
    id: "home.yesterday.spoiler"
- assertVisible:
    id: "home.yesterday.spoiler"
    text: "Spoiler is on"
- assertVisible:
    id: "home.yesterday.row.0"
    text: "Tour de Langkawi.*"
- scrollUntilVisible:
    element:
      id: "home.yesterday.row.2"
- assertVisible:
    id: "home.yesterday.row.2"
    text: "Paris-Bourges.*"
- assertNotVisible:
    id: "home.yesterday.row.3"
- scrollUntilVisible:
    element:
      id: "home.yesterday.seeAll"
    direction: UP

# See all -> every yesterday result, behind the same chip
- tapOn:
    id: "home.yesterday.seeAll"
- extendedWaitUntil:
    visible:
      id: "yesterdayResults.row.3"
    timeout: 10000
- assertVisible:
    id: "yesterdayResults.row.3"
    text: "Tre Valli Varesine.*"
- tapOn:
    id: "yesterdayResults.spoiler"
- assertVisible:
    id: "yesterdayResults.spoiler"
    text: "Spoiler is off"
- assertNotVisible:
    id: "yesterdayResults.row.3"
- tapOn:
    id: "yesterdayResults.spoiler"
- assertVisible:
    id: "yesterdayResults.row.3"
- swipe:
    start: 1%, 50%
    end: 70%, 50%

# History: the banner standing in for past seasons
- scrollUntilVisible:
    element:
      id: "home.history.banner"
- assertVisible:
    id: "home.history.banner"
    text: "Browse past seasons.*"
