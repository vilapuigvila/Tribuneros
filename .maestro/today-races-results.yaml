# Results today and Yesterday behind their spoiler setting, the Yesterday list, and the History
# banner (mock scenario "live", Debug build only). Spoilers start off: the cards and rows show
# with their race title only, and no tap opens them, until a double tap on any card or row; the
# setting is shared with the Yesterday list. There is no spoiler chip.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.results.card.0"
    timeout: 20000
# Results today: redacted by default (title only, no winner, no tap), revealed by a double tap
- assertNotVisible:
    id: "home.results.spoiler"
- assertVisible:
    id: "home.results.card.0"
    text: "Giro della Toscana.*"
- assertNotVisible: ".*MOCK Rider One.*"
- tapOn:
    id: "home.results.card.0"
- assertNotVisible: "Race Result"
- doubleTapOn:
    id: "home.results.card.0"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "home.results.card.0"
    text: "Giro della Toscana.*MOCK Rider One.*"
- doubleTapOn:
    id: "home.results.card.0"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "home.results.card.0"
    text: "Giro della Toscana.*"
- assertNotVisible: ".*MOCK Rider One.*"
# Yesterday: redacted rows by default, winners after the chip is tapped
- scrollUntilVisible:
    element:
      id: "home.yesterday.row.0"
- assertNotVisible:
    id: "home.yesterday.spoiler"
- assertVisible:
    id: "home.yesterday.row.0"
    text: "Tour de Langkawi.*"
- assertNotVisible: ".*MOCK Rider Four.*"
- tapOn:
    id: "home.yesterday.row.0"
- assertNotVisible: "Race Result"
- doubleTapOn:
    id: "home.yesterday.row.0"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "home.yesterday.row.0"
    text: "Tour de Langkawi.*MOCK Rider Four.*"
- scrollUntilVisible:
    element:
      id: "home.yesterday.row.2"
- assertVisible:
    id: "home.yesterday.row.2"
    text: "Paris-Bourges.*"
- assertNotVisible:
    id: "home.yesterday.row.3"
- scrollUntilVisible:
    element:
      id: "home.yesterday.seeAll"
    direction: UP
# See all -> every yesterday result, behind the same setting
- tapOn:
    id: "home.yesterday.seeAll"
- extendedWaitUntil:
    visible:
      id: "yesterdayResults.row.3"
    timeout: 10000
- assertNotVisible:
    id: "yesterdayResults.spoiler"
- assertVisible:
    id: "yesterdayResults.row.3"
    text: "Tre Valli Varesine.*MOCK Rider Seven.*"
- doubleTapOn:
    id: "yesterdayResults.row.3"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "yesterdayResults.row.3"
    text: "Tre Valli Varesine.*"
- assertNotVisible: ".*MOCK Rider Seven.*"
- tapOn:
    id: "yesterdayResults.row.3"
- assertNotVisible: "Race Result"
- doubleTapOn:
    id: "yesterdayResults.row.3"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "yesterdayResults.row.3"
    text: "Tre Valli Varesine.*MOCK Rider Seven.*"
- swipe:
    start: 1%, 50%
    end: 70%, 50%
# History: the banner standing in for past seasons
- scrollUntilVisible:
    element:
      id: "home.history.banner"
- assertVisible:
    id: "home.history.banner"
    text: "Browse past seasons.*"
