# Results today and Yesterday, one race at a time (mock scenario "live", Debug build only). Every
# race starts hidden (title only, spoiler art, no tap opens it); a long press on a card or row
# reveals only that race, and a second long press hides it again. Also the Yesterday list and the
# History banner.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.results.card.0"
    timeout: 20000
- tapOn:
    id: home.spoilerHint
    optional: true
# Results today: redacted by default (title only, no winner, no tap), revealed by a long press
- assertNotVisible:
    id: "home.results.spoiler"
- assertVisible:
    id: "home.results.card.0"
    text: "Giro della Toscana.*"
- assertVisible:
    id: "home.results.spoilerArt.0"
- assertNotVisible: ".*MOCK Rider One.*"
- tapOn:
    id: "home.results.card.0"
- assertNotVisible: "Race Result"
- longPressOn:
    id: "home.results.card.0"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "home.results.card.0"
    text: "Giro della Toscana.*MOCK Rider One.*"
- assertNotVisible:
    id: "home.results.spoilerArt.0"
- assertVisible:
    id: "home.results.spoilerArt.1"
- assertNotVisible: ".*MOCK Rider Two.*"
- longPressOn:
    id: "home.results.card.0"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "home.results.card.0"
    text: "Giro della Toscana.*"
- assertNotVisible: ".*MOCK Rider One.*"
# Yesterday: redacted rows by default, one winner per long press
- scrollUntilVisible:
    element:
      id: "home.yesterday.row.0"
- assertNotVisible:
    id: "home.yesterday.spoiler"
- assertVisible:
    id: "home.yesterday.row.0"
    text: "Tour de Langkawi.*"
- assertNotVisible: ".*MOCK Rider Four.*"
- tapOn:
    id: "home.yesterday.row.0"
- assertNotVisible: "Race Result"
- longPressOn:
    id: "home.yesterday.row.0"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "home.yesterday.row.0"
    text: "Tour de Langkawi.*MOCK Rider Four.*"
- assertVisible:
    id: "home.yesterday.spoilerArt.1"
- assertNotVisible: ".*MOCK Rider Five.*"
- assertNotVisible:
    id: "home.yesterday.spoilerArt.0"
- scrollUntilVisible:
    element:
      id: "home.yesterday.row.2"
- assertVisible:
    id: "home.yesterday.row.2"
    text: "Paris-Bourges.*"
- assertNotVisible:
    id: "home.yesterday.row.3"
- scrollUntilVisible:
    element:
      id: "home.yesterday.seeAll"
    direction: UP
# See all -> every yesterday result; the race revealed above is still revealed, the rest hidden
- tapOn:
    id: "home.yesterday.seeAll"
- extendedWaitUntil:
    visible:
      id: "yesterdayResults.row.3"
    timeout: 10000
- assertVisible:
    id: "yesterdayResults.row.0"
    text: "Tour de Langkawi.*MOCK Rider Four.*"
- assertVisible:
    id: "yesterdayResults.row.3"
    text: "Tre Valli Varesine.*"
- assertNotVisible: ".*MOCK Rider Seven.*"
- longPressOn:
    id: "yesterdayResults.row.3"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "yesterdayResults.row.3"
    text: "Tre Valli Varesine.*MOCK Rider Seven.*"
- longPressOn:
    id: "yesterdayResults.row.3"
    retryTapIfNoChange: false
    delay: 1
- assertVisible:
    id: "yesterdayResults.row.3"
    text: "Tre Valli Varesine.*"
- assertNotVisible: ".*MOCK Rider Seven.*"
- swipe:
    start: 1%, 50%
    end: 70%, 50%
# History: the banner standing in for past seasons
- scrollUntilVisible:
    element:
      id: "home.history.banner"
- assertVisible:
    id: "home.history.banner"
    text: "Browse past seasons.*"
