# Results today and Yesterday behind their spoiler chips, the Yesterday list, and the History
# banner (mock scenario "live", Debug build only). Spoilers start off: the cards and rows show
# with their race title only, and no tap opens them, until the chip is tapped; the setting is
# shared with the Yesterday list.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.results.spoiler"
    timeout: 20000

# Results today: redacted by default (title only, no winner, no tap), revealed by the chip
- assertVisible:
    id: "home.results.spoiler"
    text: "Spoiler is off"
- assertVisible:
    id: "home.results.card.0"
    text: "Giro della Toscana.*"
- assertNotVisible: ".*MOCK Rider One.*"
- tapOn:
    id: "home.results.card.0"
- assertNotVisible: "Race Result"
- tapOn:
    id: "home.results.spoiler"
- assertVisible:
    id: "home.results.spoiler"
    text: "Spoiler is on"
- assertVisible:
    id: "home.results.card.0"
    text: "Giro della Toscana.*MOCK Rider One.*"
- tapOn:
    id: "home.results.spoiler"
- assertVisible:
    id: "home.results.spoiler"
    text: "Spoiler is off"
- assertVisible:
    id: "home.results.card.0"
    text: "Giro della Toscana.*"
- assertNotVisible: ".*MOCK Rider One.*"

# Yesterday: redacted rows by default, winners after the chip is tapped
- scrollUntilVisible:
    element:
      id: "home.yesterday.spoiler"
- assertVisible:
    id: "home.yesterday.spoiler"
    text: "Spoiler is off"
- assertVisible:
    id: "home.yesterday.row.0"
    text: "Tour de Langkawi.*"
- assertNotVisible: ".*MOCK Rider Four.*"
- tapOn:
    id: "home.yesterday.row.0"
- assertNotVisible: "Race Result"
- tapOn:
    id: "home.yesterday.spoiler"
- assertVisible:
    id: "home.yesterday.spoiler"
    text: "Spoiler is on"
- assertVisible:
    id: "home.yesterday.row.0"
    text: "Tour de Langkawi.*MOCK Rider Four.*"
- scrollUntilVisible:
    element:
      id: "home.yesterday.row.2"
- assertVisible:
    id: "home.yesterday.row.2"
    text: "Paris-Bourges.*"
- assertNotVisible:
    id: "home.yesterday.row.3"
- scrollUntilVisible:
    element:
      id: "home.yesterday.seeAll"
    direction: UP

# See all -> every yesterday result, behind the same chip
- tapOn:
    id: "home.yesterday.seeAll"
- extendedWaitUntil:
    visible:
      id: "yesterdayResults.row.3"
    timeout: 10000
- assertVisible:
    id: "yesterdayResults.row.3"
    text: "Tre Valli Varesine.*MOCK Rider Seven.*"
- tapOn:
    id: "yesterdayResults.spoiler"
- assertVisible:
    id: "yesterdayResults.spoiler"
    text: "Spoiler is off"
- assertVisible:
    id: "yesterdayResults.row.3"
    text: "Tre Valli Varesine.*"
- assertNotVisible: ".*MOCK Rider Seven.*"
- tapOn:
    id: "yesterdayResults.row.3"
- assertNotVisible: "Race Result"
- tapOn:
    id: "yesterdayResults.spoiler"
- assertVisible:
    id: "yesterdayResults.row.3"
    text: "Tre Valli Varesine.*MOCK Rider Seven.*"
- swipe:
    start: 1%, 50%
    end: 70%, 50%

# History: the banner standing in for past seasons
- scrollUntilVisible:
    element:
      id: "home.history.banner"
- assertVisible:
    id: "home.history.banner"
    text: "Browse past seasons.*"
