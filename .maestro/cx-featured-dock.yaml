# CX Zone dock: the latest result sits in front with the next race peeking behind it. A swipe up on the
# front card trades them. Mock data only (mockScenario live).
appId: com.pskmoons.Tribuneros
tags:
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- tapOn: "CX Zone"
- extendedWaitUntil:
    visible: "NEXT ROUND"
    timeout: 45000
- assertVisible: "LATEST RESULT"

# No autoplay here (it needs dockAutoSwap): the result is in front. Maestro sees the text of the card
# behind too, so the order is read from what a tap opens.
- swipe:
    start: 50%, 84%
    end: 50%, 64%
- waitForAnimationToEnd:
    timeout: 3000

# The next race is in front now: a tap opens its detail, not the latest results list
- tapOn:
    point: 50%, 84%
- assertNotVisible: "Latest Cyclocross Results"
- takeScreenshot: cx-featured-dock
