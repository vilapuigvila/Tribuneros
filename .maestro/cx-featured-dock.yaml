# CX Zone dock: the latest result sits in front with the next race peeking behind it. The cards trade
# places by themselves (twice), and a tap on the peeking card does the same. Mock data only (mockScenario live).
appId: com.pskmoons.Tribuneros
tags:
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
      dockAutoSwap: "1"
- tapOn: "CX Zone"
- extendedWaitUntil:
    visible: "NEXT ROUND"
    timeout: 45000
- assertVisible: "LATEST RESULT"
- assertVisible: "Show the next race"

# First automatic swap: the next race comes to the front
- extendedWaitUntil:
    visible: "NEXT TO START"
    timeout: 10000
- assertVisible: "Show the latest result"
- assertNotVisible: "Show the next race"

# Second automatic swap: back to the result
- extendedWaitUntil:
    visible: "Show the next race"
    timeout: 10000

# Autoplay is over: a tap on the peeking card swaps once more and nothing moves afterwards
- tapOn: "Show the next race"
- extendedWaitUntil:
    visible: "Show the latest result"
    timeout: 5000
- tapOn: "Show the latest result"
- extendedWaitUntil:
    visible: "Show the next race"
    timeout: 5000
- takeScreenshot: cx-featured-dock
