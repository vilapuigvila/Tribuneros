# One-time long press hint on the Today Races tab (mock scenario "live", Debug build only):
# shown on the first launch with results, dismissed by tapping it, not shown on the next launch.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.results.card.0"
    timeout: 20000
- assertVisible:
    id: "home.spoilerHint"
- tapOn:
    id: "home.spoilerHint"
- assertNotVisible:
    id: "home.spoilerHint"

- launchApp:
    stopApp: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible:
      id: "home.results.card.0"
    timeout: 20000
- assertNotVisible:
    id: "home.spoilerHint"
