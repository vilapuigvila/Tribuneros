# Today Races tab on Debug mock data (mock scenario live): the header, every section and the hero
# race's live screen. Titles are drawn redacted while the page loads, so they only match once the data
# is in. The other states are fixed by today-races-later, -one, -empty and -results.
appId: com.pskmoons.Tribuneros
tags:
  - home
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- extendedWaitUntil:
    visible: "Results today"
    timeout: 45000
- assertVisible:
    id: "home.header"
- assertVisible: "Today"
- scrollUntilVisible:
    element: "Results yesterday"
    timeout: 20000
# The mock has no history rows, so History shows its banner under the title.
- scrollUntilVisible:
    element: "History"
    timeout: 20000
- assertVisible: "History"
# The mock's hero race is LIVE, so the hero card opens the live race screen.
- scrollUntilVisible:
    element:
      id: "home.header"
    direction: UP
    timeout: 20000
- tapOn:
    id: "home.today.hero"
- extendedWaitUntil:
    visible:
      id: "liveRace.title"
      text: "CRO Race.*"
    timeout: 45000
