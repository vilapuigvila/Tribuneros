# Paddock without web views: press headlines screen, the hand-off leaving no in-app sheet, the rider
# screen's PCS sections and the Season results screen, on Debug mock data (mock scenario live): no network.
appId: com.pskmoons.Tribuneros
tags:
  - mock
---
- launchApp:
    clearState: true
    arguments:
      mockScenario: live
- tapOn: "Paddock"
- extendedWaitUntil:
    visible: "Birthdays today"
    timeout: 45000
# A press circle with headlines opens the headlines screen.
- tapOn:
    id: "paddock.press.escapecollective.com"
- extendedWaitUntil:
    visible:
      id: "paddock.press.header"
    timeout: 45000
- extendedWaitUntil:
    visible: "MOCK Escape Collective headline 1"
    timeout: 45000
# A headline opens in the in-app reader sheet, over the headlines screen.
- tapOn:
    id: "paddock.press.article.0"
- extendedWaitUntil:
    notVisible:
      id: "paddock.press.header"
    timeout: 20000
- tapOn:
    id: "Close"
- extendedWaitUntil:
    visible:
      id: "paddock.press.header"
    timeout: 20000
- swipe:
    start: 1%, 50%
    end: 70%, 50%
- assertVisible: "Birthdays today"
# A site without a feed shows the empty state and "Open site".
- tapOn:
    id: "paddock.press.joanseguidor.com"
- extendedWaitUntil:
    visible:
      id: "paddock.press.unavailable"
    timeout: 45000
- assertVisible: "Open site"
- swipe:
    start: 1%, 50%
    end: 70%, 50%
# A site whose feed Cloudflare blocks opens straight in the in-app reader, with no headlines screen.
# The fourth circle starts past the screen edge: swipe the press strip itself.
- swipe:
    start: 85%, 27%
    end: 15%, 27%
- tapOn:
    id: "paddock.press.ciclismo2005.com"
- extendedWaitUntil:
    visible:
      id: "Close"
    timeout: 20000
- assertNotVisible:
    id: "paddock.press.header"
- tapOn:
    id: "Close"
- extendedWaitUntil:
    visible: "Birthdays today"
    timeout: 20000
# A Moves card opens the rider screen with the PCS sections.
- scrollUntilVisible:
    element: "TRANSFER,.*"
- tapOn: "TRANSFER,.*"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
- scrollUntilVisible:
    element: "Specialties"
- scrollUntilVisible:
    element: "Key statistics"
- scrollUntilVisible:
    element: "Top results"
- scrollUntilVisible:
    element: "Program"
- scrollUntilVisible:
    element: "Teams"
- scrollUntilVisible:
    element: "PCS ranking"
- scrollUntilVisible:
    element: "Season results"
- scrollUntilVisible:
    element:
      id: "paddock.rider.seasonResultsLink"
- tapOn:
    id: "paddock.rider.seasonResultsLink"
- extendedWaitUntil:
    visible:
      id: "paddock.seasonResults.header"
    timeout: 45000
- assertVisible: "Season results"
- assertVisible: "[0-9]+ RESULTS"
